name: Public package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Precompile the application for source subprocess tests
        run: python -m compileall -q --invalidation-mode timestamp hivemind
      - name: Source regression and standalone suites
        run: python scripts/verify.py --evidence-dir "$RUNNER_TEMP/evidence/source"
      - name: Reviewed source archive
        run: python scripts/package_release.py --out "$RUNNER_TEMP/release"
      - name: Build wheel and source distribution
        run: |
          python -m pip install 'build>=1.2,<2'
          python -m build --outdir "$RUNNER_TEMP/release"
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/release/*.whl
      - name: Installed package acceptance outside checkout
        env:
          HIVEMIND_TEST_PYTHON: ${{ runner.temp }}/installed/bin/python
        run: |
          python scripts/verify.py --pattern test_portable_release_e2e.py --evidence-dir "$RUNNER_TEMP/evidence/installed"
          python scripts/verify.py --pattern test_demo_e2e.py --evidence-dir "$RUNNER_TEMP/evidence/installed"
          python scripts/verify.py --pattern test_memory_control_e2e.py --evidence-dir "$RUNNER_TEMP/evidence/installed"
          python scripts/verify.py --pattern test_dreaming_e2e.py --evidence-dir "$RUNNER_TEMP/evidence/installed"
          python scripts/verify.py --pattern test_source_connections_e2e.py --evidence-dir "$RUNNER_TEMP/evidence/installed"
          python scripts/verify.py --pattern test_quickstart_e2e.py --evidence-dir "$RUNNER_TEMP/evidence/installed"
          python scripts/verify.py --pattern test_easy_sources_e2e.py --evidence-dir "$RUNNER_TEMP/evidence/installed"
          python scripts/verify.py --pattern test_automation_e2e.py --evidence-dir "$RUNNER_TEMP/evidence/installed"
      - name: Preserve reproducible check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
